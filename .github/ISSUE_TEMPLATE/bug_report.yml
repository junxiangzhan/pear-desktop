name: Bug Report
description: Report a Pear Tauri bug
title: "[Bug]: "
labels: "bug"
body:
- type: checkboxes
  attributes:
    label: Preflight Checklist
    description: Please ensure you've completed all of the following.
    options:
      - label: I use the latest release of Pear Tauri.
        required: true
      - label: I have searched the [issue tracker](https://github.com/junxiangzhan/pear-desktop/issues) for a bug report that matches the one I want to file, without success.
        required: true
      - label: I understand that **Pear Tauri has NO affiliation with Google or YouTube**, and that it is not the upstream Pear Desktop (Electron) app.
        required: true
- type: input
  id: app-version
  attributes:
    label: Pear Tauri Version
    description: What version of Pear Tauri are you using?
    placeholder: 0.3.0
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
      - Windows
      - Android
      - Other (specify below)
  validations:
    required: true
- type: input
  id: os-version
  attributes:
    label: Operating System and Device
    description: On Windows, Start > Settings > System > About. On Android, include the device model.
    placeholder: "e.g. Windows 11 24H2, or Android 16 on a Pixel 9"
  validations:
    required: true
- type: dropdown
  id: engine
  attributes:
    label: Page engine (Android only)
    description: GeckoView is the default; WebView is chosen with `--es engine webview`.
    options:
      - GeckoView (default)
      - WebView
      - Not applicable (Windows)
- type: checkboxes
  attributes:
    label: Checklists
    options:
      - label: I can reproduce this issue in the [web version of YouTube Music](https://music.youtube.com).
      - label: The same issue happens in upstream Pear Desktop (Electron).
- type: textarea
  attributes:
    label: Reproduction steps
    description: Provide steps to reproduce the issue.
    placeholder: 1. Enable the X plugin.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A clear and concise description of what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Actual Behavior
    description: A clear description of what actually happens.
  validations:
    required: true
- type: textarea
  id: enabled-plugins
  attributes:
    label: Enabled plugins
    description: Provide the list of plugins you enabled.
    placeholder: 1. Album Color Theme
  validations:
    required: true
- type: textarea
  attributes:
    label: Additional Information
    description: Anything else that helps, such as logs (`PEAR_DEVTOOLS=1` on Windows, logcat on Android) or screenshots.
