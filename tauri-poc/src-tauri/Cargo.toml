[package]
name = "pear-tauri-poc"
version = "0.1.0"
description = "Proof of concept: Pear Desktop renderer on Tauri v2"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows
name = "pear_tauri_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws"] }
# TLS for api-server's HTTPS option, on the ring provider reqwest already uses
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
hmac = "0.12"
# Cover art crop for the downloader (Tauri already builds it)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Downloader tags (MP4 ilst)
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
futures = "0.3"
md5 = "0.7"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "fs"] }
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# Same version as Tauri's own, so it is not compiled twice
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
